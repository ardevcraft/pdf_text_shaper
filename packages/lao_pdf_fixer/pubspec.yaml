name: lao_pdf_fixer
description: Unicode-first Lao PDF text shaping for Flutter, powered by pdf_text_shaper and HarfBuzz.
version: 1.0.0
homepage: https://github.com/ardevcraft/pdf_text_shaper
repository: https://github.com/ardevcraft/pdf_text_shaper
issue_tracker: https://github.com/ardevcraft/pdf_text_shaper/issues
documentation: https://github.com/ardevcraft/pdf_text_shaper#readme
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  pdf_text_shaper: ^1.1.0
  flutter:
    sdk: flutter
  pdf: ^3.13.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

topics:
  - lao
  - pdf
  - unicode
  - text-shaping
  - typography
